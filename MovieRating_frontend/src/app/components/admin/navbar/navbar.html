<mat-toolbar>
    <button mat-icon-button id="menuButton" (click)="toggleSidebar()">
        <mat-icon>menu</mat-icon>
    </button>
    <span class="title">
        ScreenScore
    </span>
    <span class="spacer"></span>
    <button mat-icon-button
    [matMenuTriggerFor]="menu">
        <mat-icon id="profileCircle">
            account_circle
        </mat-icon>
    </button>
    <mat-menu #menu="matMenu">
        <button mat-menu-item>
            Profile
        </button>
        <button mat-menu-item>
            Logout
        </button>
    </mat-menu>
</mat-toolbar>
