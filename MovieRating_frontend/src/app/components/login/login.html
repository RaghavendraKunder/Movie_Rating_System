<div class="login-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>
                LOGIN
            </mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="loginForm">
                <mat-form-field appearance="outline">
                    <mat-label>Email</mat-label>
                    <input
                    matInput
                    formControlName="email">
                </mat-form-field>
                <mat-form-field appearance="outline">
                    <mat-label>Password</mat-label>
                    <input
                    matInput
                    [type]="hide ? 'password' : 'text'"
                    formControlName="password">
                    <button
                    mat-icon-button
                    matSuffix
                    type="button"
                    (click)="hide=!hide">
                        <mat-icon>
                            {{hide?'visibility_off':'visibility'}}
                        </mat-icon>
                    </button>
                </mat-form-field>
                <button
                mat-raised-button
                color="primary"
                (click)="login()">
                    Login
                </button>
            </form>
        </mat-card-content>
        <mat-card-actions>
            <a routerLink="/register">
                New User? Register
            </a>
        </mat-card-actions>
    </mat-card>
</div>
